<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main Gradient -->
    <linearGradient id="kymatixWaveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#00F2FE" />
      <stop offset="50%" stopColor="#9D4EDD" />
      <stop offset="100%" stopColor="#E056FD" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="100" height="100" rx="28" fill="#08090C" />
  <rect width="100" height="100" rx="28" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Ambient Glow -->
  <path
    d="M 14 50 H 22 Q 28 50 32 36 L 36 28 Q 40 12 44 28 L 48 76 Q 52 92 56 68 L 60 40 Q 64 24 68 44 L 72 64 Q 76 72 80 50 H 86"
    stroke="url(#kymatixWaveGrad)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.45"
  />

  <!-- Core Sharp Neon Waveform -->
  <path
    d="M 14 50 H 22 Q 28 50 32 36 L 36 28 Q 40 12 44 28 L 48 76 Q 52 92 56 68 L 60 40 Q 64 24 68 44 L 72 64 Q 76 72 80 50 H 86"
    stroke="url(#kymatixWaveGrad)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#waveGlow)"
  />
</svg>
